DOCUMENTATION:
  name: dirname
  author: Peter Dutton
  short_description: Extract the directory name from a path string
  description:
    - This filter extracts the directory portion (everything before the final component) from a path string.
    - It automatically detects whether the input is a Unix-style or Windows-style path
      and applies the appropriate dirname logic.
    - The filter operates on the path string itself, not the filesystem, making it
      suitable for use on the control node without requiring target OS knowledge.
  notes:
    - Windows paths are detected by looking for backslashes, drive letters (C:), or UNC
      prefixes (\\).
    - Returns empty string for paths without a directory component.
    - This filter uses Python's C(ntpath) for Windows paths and C(posixpath) for Unix
      paths, ensuring correct behavior regardless of the control node's operating system.
  options:
    _input:
      description: A path string in Unix or Windows format
      type: str
      required: true

EXAMPLES: |
  # Unix-style paths
  - name: Extract dirname from Unix path
    debug:
      msg: "{{ '/etc/hostname' | pdutton.xplat.dirname }}"
    # Output: /etc

  - name: Extract dirname from Unix file path
    debug:
      msg: "{{ '/usr/local/bin/python3' | pdutton.xplat.dirname }}"
    # Output: /usr/local/bin

  # Windows-style paths
  - name: Extract dirname from Windows path
    debug:
      msg: "{{ 'C:\\Windows\\System32\\cmd.exe' | pdutton.xplat.dirname }}"
    # Output: C:\Windows\System32

  - name: Extract dirname from Windows path with forward slashes
    debug:
      msg: "{{ 'C:/Users/Admin/Documents/report.pdf' | pdutton.xplat.dirname }}"
    # Output: C:/Users/Admin/Documents

  # UNC paths
  - name: Extract dirname from UNC network path
    debug:
      msg: "{{ '\\\\server\\share\\folder\\document.docx' | pdutton.xplat.dirname }}"
    # Output: \\server\share\folder

  # Edge cases
  - name: Extract dirname from single filename
    debug:
      msg: "{{ 'filename.txt' | pdutton.xplat.dirname }}"
    # Output: (empty string)

  - name: Extract dirname from root path
    debug:
      msg: "{{ '/' | pdutton.xplat.dirname }}"
    # Output: (empty string)

RETURN:
  _value:
    description: The directory portion of the path
    type: str
    sample: /etc
